name: Build Simple iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: Simple-iOS-App
        
    - name: List Swift files
      run: find Simple-iOS-App/Sources -name "*.swift"
    
    - name: Build with Swift Package Manager
      run: |
        cd Simple-iOS-App
        swift build --arch arm64-apple-ios16.0-simulator
        
    - name: Create Xcode Project
      run: |
        cd Simple-iOS-App
        swift package generate-xcodeproj
        
    - name: Build with xcodebuild
      run: |
        cd Simple-iOS-App
        xcodebuild build \
          -scheme Simple-iOS-App \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty
        
    - name: Archive
      run: |
        cd Simple-iOS-App
        xcodebuild archive \
          -scheme Simple-iOS-App \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -archivePath Build/SimpleApp.xcarchive \
          CODE_SIGNING_ALLOWED=NO
        
    - name: Export IPA
      run: |
        cd Simple-iOS-App
        cat > ExportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF
        xcodebuild -exportArchive \
          -archivePath Build/SimpleApp.xcarchive \
          -exportPath Build/Exported \
          -exportOptionsPlist ExportOptions.plist
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Simple-iOS-App
        path: Simple-iOS-App/Build/Exported/*.ipa
        retention-days: 7