name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Xcode
      run: sudo xcode-select -switch /Applications/Xcode_15.0.app
    
    - name: Build
      run: |
        cd DeepSeek-iOS
        xcodebuild build \
          -scheme DeepSeek-iOS \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO
        
    - name: Archive
      run: |
        cd DeepSeek-iOS
        xcodebuild archive \
          -scheme DeepSeek-iOS \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -archivePath Build/DeepSeek-iOS.xcarchive \
          CODE_SIGNING_ALLOWED=NO
        
    - name: Export IPA
      run: |
        cd DeepSeek-iOS
        xcodebuild -exportArchive \
          -archivePath Build/DeepSeek-iOS.xcarchive \
          -exportPath Build/Exported \
          -exportOptionsPlist ExportOptions.plist
        
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: DeepSeek-iOS
        path: DeepSeek-iOS/Build/Exported/DeepSeek-iOS.ipa